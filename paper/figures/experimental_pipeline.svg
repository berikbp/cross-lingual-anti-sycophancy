<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Experimental pipeline from v1 failure to locked evaluation</title>
  <desc id="desc">Five connected stages show naive v1 training, its stubbornness diagnosis, the balanced v2 redesign, matched adapter training, and locked multilingual evaluation.</desc>
  <rect width="1200" height="330" fill="#ffffff"/>
  <text x="600" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172033">Experimental pipeline</text>
  <g font-family="sans-serif" text-anchor="middle">
    <g transform="translate(30 90)">
      <rect width="190" height="125" rx="12" fill="#fbe9e7" stroke="#c64b3c" stroke-width="2"/>
      <text x="95" y="32" font-size="17" font-weight="700" fill="#70251d">V1 training</text>
      <text x="95" y="60" font-size="14" fill="#352321">Correct initial</text>
      <text x="95" y="82" font-size="14" fill="#352321">Unchanged target</text>
      <text x="95" y="104" font-size="14" fill="#352321">1,000 examples</text>
    </g>
    <g transform="translate(270 90)">
      <rect width="190" height="125" rx="12" fill="#fff3cd" stroke="#b58400" stroke-width="2"/>
      <text x="95" y="32" font-size="17" font-weight="700" fill="#684e00">Diagnosis</text>
      <text x="95" y="60" font-size="14" fill="#352f18">Capability loss</text>
      <text x="95" y="82" font-size="14" fill="#352f18">Near-total stubbornness</text>
      <text x="95" y="104" font-size="14" fill="#352f18">Preservation shortcut</text>
    </g>
    <g transform="translate(510 90)">
      <rect width="190" height="125" rx="12" fill="#e5f2ff" stroke="#3676b5" stroke-width="2"/>
      <text x="95" y="32" font-size="17" font-weight="700" fill="#204c76">V2 redesign</text>
      <text x="95" y="60" font-size="14" fill="#243442">CW · WC · CC · WW</text>
      <text x="95" y="82" font-size="14" fill="#243442">50/50 initial state</text>
      <text x="95" y="104" font-size="14" fill="#243442">50/50 feedback</text>
    </g>
    <g transform="translate(750 90)">
      <rect width="190" height="125" rx="12" fill="#e9f6ee" stroke="#3b8a57" stroke-width="2"/>
      <text x="95" y="32" font-size="17" font-weight="700" fill="#245736">Matched QLoRA</text>
      <text x="95" y="60" font-size="14" fill="#263d2e">Control-v2</text>
      <text x="95" y="82" font-size="14" fill="#263d2e">Selective-v2</text>
      <text x="95" y="104" font-size="14" fill="#263d2e">Fresh base model</text>
    </g>
    <g transform="translate(990 90)">
      <rect width="180" height="125" rx="12" fill="#eee9f7" stroke="#7552a3" stroke-width="2"/>
      <text x="90" y="32" font-size="17" font-weight="700" fill="#4d3370">Locked test</text>
      <text x="90" y="60" font-size="14" fill="#332c3d">EN · RU · KK</text>
      <text x="90" y="82" font-size="14" fill="#332c3d">300 stems each</text>
      <text x="90" y="104" font-size="14" fill="#332c3d">10,800 branches</text>
    </g>
  </g>
  <g stroke="#697386" stroke-width="3" fill="none">
    <path d="M225 152 H258"/><path d="M465 152 H498"/><path d="M705 152 H738"/><path d="M945 152 H978"/>
  </g>
  <g fill="#697386">
    <path d="M258 152 l-10 -6 v12z"/><path d="M498 152 l-10 -6 v12z"/><path d="M738 152 l-10 -6 v12z"/><path d="M978 152 l-10 -6 v12z"/>
  </g>
  <text x="600" y="270" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#384255">The v2 conditions differ only in the follow-up user message; training targets and hyperparameters are matched.</text>
  <text x="600" y="300" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#6a7383">The original Kazakh evaluation is retained historically; its corrected, author-reviewed artifact is versioned separately.</text>
</svg>
