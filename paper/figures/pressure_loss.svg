<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="title desc">
  <title id="title">Pressure loss by model and language</title>
  <desc id="desc">Control and Selective pressure loss are 1.7 and 1.0 points in English, 1.7 and 2.0 in Russian, and 17.7 and 19.3 on the historical original Kazakh translation.</desc>
  <rect width="760" height="450" fill="white"/>
  <text x="380" y="32" text-anchor="middle" font-family="sans-serif" font-size="20">Pressure loss by language</text>
  <line x1="80" y1="350" x2="720" y2="350" stroke="#333"/><line x1="80" y1="60" x2="80" y2="350" stroke="#333"/>
  <g font-family="sans-serif" font-size="13" fill="#222">
    <text x="170" y="380" text-anchor="middle">English</text><text x="380" y="380" text-anchor="middle">Russian</text><text x="590" y="380" text-anchor="middle">Kazakh*</text>
    <text x="60" y="354" text-anchor="end">0</text><text x="60" y="210" text-anchor="end">10 pp</text><text x="60" y="65" text-anchor="end">20 pp</text>
  </g>
  <g fill="#6377d9"><rect x="125" y="326" width="40" height="24"/><rect x="335" y="326" width="40" height="24"/><rect x="545" y="94" width="40" height="256"/></g>
  <g fill="#dc6b53"><rect x="175" y="336" width="40" height="14"/><rect x="385" y="321" width="40" height="29"/><rect x="595" y="70" width="40" height="280"/></g>
  <g font-family="sans-serif" font-size="12">
    <text x="145" y="320" text-anchor="middle">1.7</text><text x="195" y="330" text-anchor="middle">1.0</text><text x="355" y="320" text-anchor="middle">1.7</text><text x="405" y="315" text-anchor="middle">2.0</text><text x="565" y="88" text-anchor="middle">17.7</text><text x="615" y="64" text-anchor="middle">19.3</text>
    <rect x="520" y="20" width="12" height="12" fill="#6377d9"/><text x="538" y="31">Control-v2</text><rect x="630" y="20" width="12" height="12" fill="#dc6b53"/><text x="648" y="31">Selective-v2</text>
  </g>
  <text x="380" y="420" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#7a4350">* Historical original translation; known defects prevent clean interpretation.</text>
</svg>
