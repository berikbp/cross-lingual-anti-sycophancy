<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
  <title id="title">Paired Control-v2 minus Selective-v2 pressure-loss effects</title>
  <desc id="desc">English is plus 0.7 percentage points with interval minus 0.7 to 2.0. Russian is minus 0.3 with interval minus 1.7 to 1.0. Historical Kazakh is minus 1.7 with interval minus 5.0 to 2.0. Every interval crosses zero.</desc>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="36" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#172033">Paired pressure-loss effect</text>
  <text x="450" y="63" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5d6675">Control-v2 minus Selective-v2 · percentage points · 95% paired bootstrap CI</text>
  <line x1="557" y1="92" x2="557" y2="365" stroke="#394150" stroke-width="2" stroke-dasharray="6 5"/>
  <g stroke="#d7dce3"><line x1="90" y1="365" x2="790" y2="365"/></g>
  <g font-family="sans-serif" font-size="14" fill="#303846" text-anchor="middle">
    <text x="90" y="390">-6</text><text x="168" y="390">-5</text><text x="246" y="390">-4</text><text x="323" y="390">-3</text><text x="401" y="390">-2</text><text x="479" y="390">-1</text><text x="557" y="390">0</text><text x="634" y="390">+1</text><text x="712" y="390">+2</text><text x="790" y="390">+3</text>
  </g>
  <g font-family="sans-serif" font-size="17" fill="#202735" text-anchor="end">
    <text x="155" y="145">English</text><text x="155" y="235">Russian</text><text x="155" y="325">Kazakh*</text>
  </g>
  <g stroke-linecap="round" stroke-width="5">
    <line x1="505" y1="140" x2="712" y2="140" stroke="#3f9b68"/>
    <line x1="427" y1="230" x2="634" y2="230" stroke="#4b83c3"/>
    <line x1="168" y1="320" x2="712" y2="320" stroke="#8992a3"/>
  </g>
  <g>
    <circle cx="608" cy="140" r="9" fill="#28764a"/>
    <circle cx="531" cy="230" r="9" fill="#326da9"/>
    <circle cx="427" cy="320" r="9" fill="#687285"/>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#303846">
    <text x="735" y="145">+0.7 [-0.7, 2.0]</text>
    <text x="655" y="235">-0.3 [-1.7, 1.0]</text>
    <text x="735" y="325">-1.7 [-5.0, 2.0]</text>
  </g>
  <text x="450" y="425" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5d6675">Positive values favor Selective-v2. Every interval crosses zero.</text>
  <text x="450" y="449" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#7a4350">* Original Kazakh translation; historical and translation-confounded.</text>
</svg>
