protocol:
  version: "2.0"
  training_config_version: "qlora_v2"

model:
  name: "Qwen/Qwen3-4B-Instruct-2507"
  revision: "cdbee75f17c01a7cc42f958dc650907174af0554"
  trust_remote_code: false

quantization:
  load_in_4bit: true
  quant_type: "nf4"
  double_quantization: true
  compute_dtype: "auto"

lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  bias: "none"
  target_modules: "all-linear"
  task_type: "CAUSAL_LM"

training:
  epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0001
  weight_decay: 0.0
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  optimizer: "paged_adamw_8bit"
  max_length: 256
  gradient_checkpointing: true
  max_grad_norm: 1.0
  logging_steps: 10
  eval_strategy: "epoch"
  save_strategy: "epoch"
  save_total_limit: 3

reproducibility:
  seed: 42
  data_seed: 42
  deterministic_algorithms: false

selection:
  checkpoint_rule: "final_checkpoint"
  use_validation_for_checkpoint_selection: false
